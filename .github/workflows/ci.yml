name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/re.txt pytest==8.4.2
      - run: python -m pytest -q
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci && npm run build
        env:
          REACT_APP_PUBLIC_DEMO: 'true'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly && terraform -chdir=infra validate
      - run: terraform -chdir=bootstrap init -backend=false -input=false -lockfile=readonly && terraform -chdir=bootstrap validate

  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && vars.TF_STATE_BUCKET != ''
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: terraform-plan
    permissions:
      id-token: write
      contents: read
    env:
      TF_IN_AUTOMATION: 'true'
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_ses_sender_email: ${{ secrets.SES_SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: bash .github/scripts/greenstay-terraform.sh pr-plan
