services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenstay
      POSTGRES_USER: greenstay
      POSTGRES_PASSWORD: greenstay-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "greenstay", "-d", "greenstay"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    image: greenstay-app-backend:latest
    build:
      context: .
      dockerfile: DevOps/Dockerfile.backend
    expose:
      - "5000"
    environment:
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://greenstay:greenstay-local@postgres:5432/greenstay
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: greenstay@example.test
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/healthz', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: always

  frontend:
    image: greenstay-app-frontend:latest
    build:
      context: .
      dockerfile: DevOps/Dockerfile.frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  postgres-data:
