name: Deploy GreenStay

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: greenstay-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && vars.GREENSTAY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    outputs:
      fingerprint: ${{ steps.preview.outputs.fingerprint }}
    env:
      TF_VAR_ses_sender_email: ${{ secrets.SES_SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - id: preview
        run: bash .github/scripts/greenstay-terraform.sh bootstrap-preview

  frontend:
    if: github.ref == 'refs/heads/main' && vars.GREENSTAY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci && npm run build
        env:
          REACT_APP_PUBLIC_DEMO: 'true'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: greenstay-frontend
          path: build/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    name: Publish artifacts and prepare the release plan
    needs: [preview, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-publish
    permissions:
      id-token: write
      contents: read
    outputs:
      plan_key: ${{ steps.publish.outputs.plan_key }}
      plan_sha256: ${{ steps.publish.outputs.plan_sha256 }}
    env:
      BOOTSTRAP_FINGERPRINT: ${{ needs.preview.outputs.fingerprint }}
      TF_VAR_ses_sender_email: ${{ secrets.SES_SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: greenstay-frontend
          path: build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - id: publish
        run: bash .github/scripts/greenstay-terraform.sh publish

  apply:
    name: Apply the reviewed release and verify health
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      PLAN_KEY: ${{ needs.publish.outputs.plan_key }}
      PLAN_SHA256: ${{ needs.publish.outputs.plan_sha256 }}
      TF_VAR_ses_sender_email: ${{ secrets.SES_SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify main still points to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: bash .github/scripts/greenstay-terraform.sh apply
